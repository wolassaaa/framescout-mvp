[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "framescout"
version = "0.1.0"
description = "Local-first technical culling and tagging for sports photography"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "Pillow>=10.0"]

[project.optional-dependencies]
yolo = ["ultralytics>=8.3"]
dev = ["pytest>=8.0"]

[project.scripts]
framescout = "framescout.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
